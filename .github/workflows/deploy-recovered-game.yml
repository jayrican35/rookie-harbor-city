      - name: Check out the main game release
        uses: actions/checkout@v4
        with:
          path: main-game-release
          persist-credentials: false

      - name: Install the verified main game at the public root
        shell: bash
        run: |
          set -euo pipefail
          python3 main-game-release/tools/package_main_game.py
          cp -a main-game-release/published-game-capture/. site/
          cmp -s main-game-release/published-game-capture/index.html site/index.html
          cmp -s main-game-release/published-game-capture/game-v115.bundle.js site/game-v115.bundle.js
          cmp -s game-backup/published-game-capture/outbreak.css site/outbreak.css

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload recovered website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy recovered website
        id: deployment
        uses: actions/deploy-pages@v4
