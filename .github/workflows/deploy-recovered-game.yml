name: Play recovered ROOKIE on GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-recovered-game.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-recovered-rookie
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out isolated published-game backup
        uses: actions/checkout@v4
        with:
          ref: published-v1-backup
          path: game-backup
          persist-credentials: false

      - name: Check out isolated V113 visual preview
        uses: actions/checkout@v4
        with:
          ref: feature/v113-visual-polish
          path: visual-preview
          persist-credentials: true

      - name: Check out V114 Case 002 preview (isolated)
        uses: actions/checkout@v4
        with:
          ref: feature/v114-midnight-pickle-panic
          path: pickle-preview
          persist-credentials: false

      - name: Check out V115 world atlas preview
        uses: actions/checkout@v4
        with:
          ref: feature/v115-one-living-world
          path: world-preview
          persist-credentials: false

      - name: Check out V115 professional street alignment (isolated)
        uses: actions/checkout@v4
        with:
          ref: feature/v115-road-and-visual-grid
          path: street-preview
          persist-credentials: false

      - name: Check out V115 Precinct-to-Midtown visual showcase
        uses: actions/checkout@v4
        with:
          ref: feature/v115-showcase-precinct-midtown
          path: showcase-preview
          persist-credentials: false

      - name: Check out reference-guided V115 city composition
        uses: actions/checkout@v4
        with:
          ref: feature/v115-reference-city-composition
          path: reference-preview
          persist-credentials: false

      - name: Check out V115 Premium Environments (isolated)
        uses: actions/checkout@v4
        with:
          ref: feature/v115-premium-environments-pass2
          path: premium-preview
          persist-credentials: false

      - name: Check out V115 Precinct Tilemap Art Pilot
        uses: actions/checkout@v4
        with:
          ref: feature/v115-precinct-tileset-pilot
          path: precinct-pilot
          persist-credentials: false

      - name: Check out V116 Southbay Marina game integration
        uses: actions/checkout@v4
        with:
          ref: e14214c11b1ba9ab137d37df68b237778b91afdf # verified shared Jay walk/run across city and campaign
          path: v116-marina
          persist-credentials: false

      - name: Recover missing main-campaign environment art
        shell: bash
        working-directory: visual-preview
        run: |
          set -euo pipefail
          python3 tools/recover_v113_world_art.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("published-game-capture")
          report = json.loads((root/"V113-WORLD-ART-RECOVERY.json").read_text())
          count = report["midtown_available"]
          print("Verified Midtown images:", count, "/", report["midtown_required"])
          assert count == report["midtown_required"], "Still missing Midtown storefront art; refusing incomplete preview deployment"
          PY

      - name: Commit restored assets to visual feature branch
        shell: bash
        working-directory: visual-preview
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f published-game-capture/V113-WORLD-ART-RECOVERY.json
          for directory in midtown maple-court exterior; do
            if [ -d "published-game-capture/assets/$directory" ]; then
              git add -f "published-game-capture/assets/$directory/"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Restore missing main-campaign storefront and world sprites"
            git push origin HEAD:feature/v113-visual-polish
          fi

      - name: Prepare game website without modifying source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp -a game-backup/published-game-capture/. site/
          test -s site/index.html
          test -s site/game.js
          touch site/.nojekyll
          echo "Recovered game JavaScript size: $(wc -c < site/game.js)"
          echo "Recovered art/audio file count: $(find site/assets -type f | wc -l)"
          echo "Note: This publishes a TEST copy of the recovered game, not the original editor project."

      - name: Add V113 preview under a separate URL only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/preview/v113
          cp -a visual-preview/published-game-capture/. site/preview/v113/
          test -s site/preview/v113/visual-polish-v113.js
          test -s site/preview/v113/visual-polish-v113.css
          node --check site/preview/v113/visual-polish-v113.js
          cmp -s game-backup/published-game-capture/index.html site/index.html
          cmp -s game-backup/published-game-capture/game.js site/game.js
          cmp -s game-backup/published-game-capture/outbreak.css site/outbreak.css
          cmp -s game-backup/published-game-capture/game.js site/preview/v113/game.js
          cmp -s game-backup/published-game-capture/outbreak.css site/preview/v113/outbreak.css
          echo "PASS: original playable root and Zombie Outbreak source remain byte-for-byte identical."
          echo "Preview path: /rookie-harbor-city/preview/v113/"

      - name: Add V114 funny Case 002 preview without changing main or V113
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/preview/v114
          cp -a pickle-preview/published-game-capture/. site/preview/v114/
          test -s site/preview/v114/game.js
          test -s site/preview/v114/v114-preview-save-isolation.js
          node --check site/preview/v114/game.js
          node --check site/preview/v114/v114-preview-save-isolation.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/preview/v114/index.html')
          html=p.read_text()
          script='<script src="./game.js"></script>'
          assert html.count(script)==1,'Could not safely inject preview-only save isolation'
          html=html.replace(script,'<script src="./v114-preview-save-isolation.js"></script>\n'+script)
          p.write_text(html)
          text=(Path('site/preview/v114/game.js')).read_text()
          assert 'CASE002_PICKLE_PANIC_V114' in text
          assert 'case2ConclusionChoices' in text
          assert len(text)>1450000
          PY
          (cd pickle-preview && node qa/test_case002_v114.cjs)
          cmp -s game-backup/published-game-capture/index.html site/index.html
          cmp -s game-backup/published-game-capture/game.js site/game.js
          cmp -s game-backup/published-game-capture/outbreak.css site/outbreak.css
          cmp -s visual-preview/published-game-capture/game.js site/preview/v113/game.js
          cmp -s visual-preview/published-game-capture/outbreak.css site/preview/v113/outbreak.css
          cmp -s game-backup/published-game-capture/outbreak.css site/preview/v114/outbreak.css
          echo "PASS: original home-screen game, V113 preview and Zombie Outbreak remain unchanged"
          echo "V114 URL: /rookie-harbor-city/preview/v114/"

      - name: Build isolated V115 private-scope preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/preview/v115
          cp -a world-preview/published-game-capture/. site/preview/v115/
          node --check site/preview/v115/v115-world.js
          node --check site/preview/v115/v115-campus.js
          node --check site/preview/v115/game.js
          python3 world-preview/tools/build_v115_preview.py site/preview/v115 pickle-preview/published-game-capture/game.js
          node --check site/preview/v115/game-v115.bundle.js
          (cd world-preview && node qa/check-v115-world.cjs published-game-capture/v115-world.js)
          (cd world-preview && node qa/check-v115-campus.cjs)
          (cd world-preview && node qa/check-v115-connected-city.cjs)
          (cd world-preview && node qa/check-v115-road-layout.cjs)
          cmp -s game-backup/published-game-capture/index.html site/index.html
          cmp -s game-backup/published-game-capture/game.js site/game.js
          cmp -s game-backup/published-game-capture/outbreak.css site/outbreak.css
          cmp -s pickle-preview/published-game-capture/game.js site/preview/v115/game.js
          cmp -s game-backup/published-game-capture/outbreak.css site/preview/v115/outbreak.css
          test -s site/preview/v115/game-v115.bundle.js
          grep -q 'V115 DEV BUILD' site/preview/v115/index.html
          grep -q 'game-v115.bundle.js' site/preview/v115/index.html
          echo "PASS: V115 world and campus share engine scope; normal game and Zombie Outbreak remain byte-for-byte unchanged"
          echo "V115 aligned-roads preview: /rookie-harbor-city/preview/v115/"

      - name: Build isolated V115 professional street-grid comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/preview/v115-roads
          cp -a street-preview/published-game-capture/. site/preview/v115-roads/
          test -s site/preview/v115-roads/v115-city-fabric.js
          node --check site/preview/v115-roads/v115-city-fabric.js
          node --check site/preview/v115-roads/v115-campus.js
          node --check site/preview/v115-roads/v115-world.js
          python3 street-preview/tools/build_v115_preview.py site/preview/v115-roads pickle-preview/published-game-capture/game.js
          node --check site/preview/v115-roads/game-v115.bundle.js
          (cd street-preview && node qa/check-v115-world.cjs published-game-capture/v115-world.js)
          (cd street-preview && node qa/check-v115-campus.cjs)
          (cd street-preview && node qa/check-v115-connected-city.cjs)
          (cd street-preview && node qa/check-v115-city-fabric.cjs)
          grep -q 'CITY STREETS' site/preview/v115-roads/game-v115.bundle.js || grep -q 'STREET ALIGNMENT PASS' site/preview/v115-roads/game-v115.bundle.js
          cmp -s game-backup/published-game-capture/index.html site/index.html
          cmp -s game-backup/published-game-capture/game.js site/game.js
          cmp -s game-backup/published-game-capture/outbreak.css site/outbreak.css
          cmp -s world-preview/published-game-capture/game.js site/preview/v115-roads/game.js
          cmp -s game-backup/published-game-capture/outbreak.css site/preview/v115-roads/outbreak.css
          cmp -s world-preview/published-game-capture/index.html site/preview/v115/index.html || true
          echo "PASS: isolated street-alignment preview, original root and Zombie Outbreak unchanged"
          echo "Compare: /rookie-harbor-city/preview/v115-roads/"

      - name: Build isolated V115 visual-showcase preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/preview/v115-showcase
          cp -a showcase-preview/published-game-capture/. site/preview/v115-showcase/
          test -s site/preview/v115-showcase/v115-showcase.js
          test -s site/preview/v115-showcase/v115-showcase.css
          grep -q 'rookie:v115-showcase-sandbox:' site/preview/v115-showcase/v115-preview-save-isolation.js
          node --check site/preview/v115-showcase/v115-showcase.js
          node --check site/preview/v115-showcase/v115-campus.js
          python3 showcase-preview/tools/build_v115_preview.py site/preview/v115-showcase pickle-preview/published-game-capture/game.js
          python3 showcase-preview/tools/build_v115_showcase_preview.py site/preview/v115-showcase
          node --check site/preview/v115-showcase/game-v115.bundle.js
          (cd showcase-preview && node qa/check-v115-world.cjs published-game-capture/v115-world.js)
          (cd showcase-preview && node qa/check-v115-campus.cjs)
          (cd showcase-preview && node qa/check-v115-connected-city.cjs)
          (cd showcase-preview && node qa/check-v115-road-layout.cjs)
          (cd showcase-preview && node qa/check-v115-showcase.cjs)
          cmp -s game-backup/published-game-capture/index.html site/index.html
          cmp -s game-backup/published-game-capture/game.js site/game.js
          cmp -s game-backup/published-game-capture/outbreak.css site/outbreak.css
          cmp -s world-preview/published-game-capture/game.js site/preview/v115-showcase/game.js
          cmp -s game-backup/published-game-capture/outbreak.css site/preview/v115-showcase/outbreak.css
          grep -q 'v115-showcase.js' site/preview/v115-showcase/index.html
          grep -q 'game-v115.bundle.js' site/preview/v115-showcase/index.html
          echo "PASS: isolated showcase, original game, other previews and Zombie Outbreak preserved."
          echo "Showcase preview: /rookie-harbor-city/preview/v115-showcase/"

      - name: Build isolated V115 reference-guided city preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/preview/v115-reference
          cp -a reference-preview/published-game-capture/. site/preview/v115-reference/
          test -s site/preview/v115-reference/v115-reference-art.js
          test -s site/preview/v115-reference/v115-reference.css
          grep -q 'rookie:v115-reference-sandbox:' site/preview/v115-reference/v115-preview-save-isolation.js
          node --check site/preview/v115-reference/v115-reference-art.js
          node --check site/preview/v115-reference/v115-campus.js
          node --check site/preview/v115-reference/v115-world.js
          python3 reference-preview/tools/build_v115_preview.py site/preview/v115-reference pickle-preview/published-game-capture/game.js
          python3 reference-preview/tools/build_v115_showcase_preview.py site/preview/v115-reference
          python3 reference-preview/tools/build_v115_reference_preview.py site/preview/v115-reference
          node --check site/preview/v115-reference/game-v115.bundle.js
          (cd reference-preview && node qa/check-v115-world.cjs published-game-capture/v115-world.js)
          (cd reference-preview && node qa/check-v115-campus.cjs)
          (cd reference-preview && node qa/check-v115-connected-city.cjs)
          (cd reference-preview && node qa/check-v115-road-layout.cjs)
          (cd reference-preview && node qa/check-v115-showcase.cjs)
          (cd reference-preview && node qa/check-v115-reference.cjs)
          cmp -s game-backup/published-game-capture/index.html site/index.html
          cmp -s game-backup/published-game-capture/game.js site/game.js
          cmp -s game-backup/published-game-capture/outbreak.css site/outbreak.css
          cmp -s showcase-preview/published-game-capture/game.js site/preview/v115-reference/game.js
          cmp -s game-backup/published-game-capture/outbreak.css site/preview/v115-reference/outbreak.css
          grep -q 'v115-reference-art.js' site/preview/v115-reference/index.html
          grep -q 'game-v115.bundle.js' site/preview/v115-reference/index.html
          echo "PASS: reference world visual preview, original gameplay and Zombie Outbreak untouched."
          echo "Reference preview: /rookie-harbor-city/preview/v115-reference/"

      - name: Build isolated V115 premium environment art preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/preview/v115-premium
          cp -a premium-preview/published-game-capture/. site/preview/v115-premium/
          test -s site/preview/v115-premium/v115-premium-art.js
          test -s site/preview/v115-premium/assets/v115-premium/mountain-north.svg
          test -s site/preview/v115-premium/assets/v115-premium/waterfall-cliff.svg
          test -s site/preview/v115-premium/assets/v115-premium/marina-lighthouse.svg
          grep -q 'rookie:v115-premium-sandbox:' site/preview/v115-premium/v115-preview-save-isolation.js
          node --check site/preview/v115-premium/v115-premium-art.js
          node --check site/preview/v115-premium/v115-world.js
          node --check site/preview/v115-premium/v115-campus.js
          python3 premium-preview/tools/build_v115_preview.py site/preview/v115-premium pickle-preview/published-game-capture/game.js
          python3 premium-preview/tools/build_v115_showcase_preview.py site/preview/v115-premium
          python3 premium-preview/tools/build_v115_reference_preview.py site/preview/v115-premium
          python3 premium-preview/tools/build_v115_premium_preview.py site/preview/v115-premium
          node --check site/preview/v115-premium/game-v115.bundle.js
          (cd premium-preview && node qa/check-v115-world.cjs published-game-capture/v115-world.js)
          (cd premium-preview && node qa/check-v115-campus.cjs)
          (cd premium-preview && node qa/check-v115-connected-city.cjs)
          (cd premium-preview && node qa/check-v115-road-layout.cjs)
          (cd premium-preview && node qa/check-v115-showcase.cjs)
          (cd premium-preview && node qa/check-v115-reference.cjs)
          (cd premium-preview && node qa/check-v115-premium.cjs)
          cmp -s game-backup/published-game-capture/index.html site/index.html
          cmp -s game-backup/published-game-capture/game.js site/game.js
          cmp -s game-backup/published-game-capture/outbreak.css site/outbreak.css
          cmp -s reference-preview/published-game-capture/game.js site/preview/v115-premium/game.js
          cmp -s game-backup/published-game-capture/outbreak.css site/preview/v115-premium/outbreak.css
          grep -q 'v115-premium-art.js' site/preview/v115-premium/index.html
          grep -q 'game-v115.bundle.js' site/preview/v115-premium/index.html
          echo "PASS: isolated premium environment preview; production and Zombie Outbreak byte-for-byte unchanged"
          echo "Preview: /rookie-harbor-city/preview/v115-premium/"

      - name: Build isolated V115 Precinct 9 asset/tilemap pilot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/preview/v115-pilot
          cp -a precinct-pilot/published-game-capture/. site/preview/v115-pilot/
          test -s site/preview/v115-pilot/assets/v115-precinct-pilot/precinct-ground-atlas.png
          test -s site/preview/v115-pilot/assets/v115-precinct-pilot/precinct-pilot.json
          test -s site/preview/v115-pilot/v115-precinct-pilot.js
          grep -q 'rookie:v115-precinct-pilot-sandbox:' site/preview/v115-pilot/v115-preview-save-isolation.js
          python3 precinct-pilot/tools/build_v115_preview.py site/preview/v115-pilot pickle-preview/published-game-capture/game.js
          python3 precinct-pilot/tools/build_v115_showcase_preview.py site/preview/v115-pilot
          python3 precinct-pilot/tools/build_v115_reference_preview.py site/preview/v115-pilot
          python3 precinct-pilot/tools/build_v115_premium_preview.py site/preview/v115-pilot
          python3 precinct-pilot/tools/build_v115_precinct_pilot_preview.py site/preview/v115-pilot
          node --check site/preview/v115-pilot/game-v115.bundle.js
          (cd precinct-pilot && node qa/check-v115-precinct-pilot.cjs)
          (cd precinct-pilot && node qa/check-v115-campus.cjs)
          (cd precinct-pilot && node qa/check-v115-road-layout.cjs)
          cmp -s game-backup/published-game-capture/index.html site/index.html
          cmp -s game-backup/published-game-capture/game.js site/game.js
          cmp -s game-backup/published-game-capture/outbreak.css site/outbreak.css
          cmp -s premium-preview/published-game-capture/game.js site/preview/v115-pilot/game.js
          cmp -s game-backup/published-game-capture/outbreak.css site/preview/v115-pilot/outbreak.css
          echo 'PASS: Precinct 9 asset/tilemap pilot builds independently without changing production or Zombie Outbreak'

      - name: Capture identical-camera mobile before/after screenshots
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --directory site >/tmp/rookie-pilot-http.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/preview/v115-pilot/ >/dev/null; then break; fi
            sleep 1
          done
          PILOT_URL='http://127.0.0.1:8765/preview/v115-pilot/?pilotQA=1' \
            PILOT_EVIDENCE="$PWD/site/preview/v115-pilot/evidence" \
            node precinct-pilot/qa/capture-v115-precinct-pilot.cjs
          cp precinct-pilot/qa/V115-PILOT-COMPARE.html site/preview/v115-pilot/evidence/index.html
          test -s site/preview/v115-pilot/evidence/before.png
          test -s site/preview/v115-pilot/evidence/after.png
          test -s site/preview/v115-pilot/evidence/metrics.json
          echo 'PASS: real game canvas screenshots, identical Android camera & zoom'

      - name: Build isolated V116 connected-world marina implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/preview/v116-marina
          cp -a v116-marina/published-game-capture/. site/preview/v116-marina/
          test -s site/preview/v116-marina/assets/v116-marina/marina-tiles.png
          test -s site/preview/v116-marina/assets/v116-marina/boat-sail.png
          grep -q 'rookie:v116-marina-sandbox:' site/preview/v116-marina/v115-preview-save-isolation.js
          python3 v116-marina/tools/build_v115_preview.py site/preview/v116-marina pickle-preview/published-game-capture/game.js
          python3 v116-marina/tools/build_v115_showcase_preview.py site/preview/v116-marina
          python3 v116-marina/tools/build_v115_reference_preview.py site/preview/v116-marina
          python3 v116-marina/tools/build_v115_premium_preview.py site/preview/v116-marina
          python3 v116-marina/tools/build_v115_precinct_pilot_preview.py site/preview/v116-marina
          python3 v116-marina/tools/build_v116_preview.py site/preview/v116-marina
          node --check site/preview/v116-marina/game-v115.bundle.js
          node --check site/preview/v116-marina/v116-marina.js
          grep -q 'CAP=40' site/preview/v116-marina/v116-marina.js
          (cd v116-marina && node qa/check-v116-marina.cjs)
          (cd v116-marina && node qa/check-v116-hud.cjs)
          (cd v116-marina && node qa/check-v116-walk.cjs)
          (cd v116-marina && node qa/check-v117-jay.cjs ../site/preview/v116-marina/game-v115.bundle.js)
          node --check site/preview/v116-marina/v117-jay.js
          grep -q 'v117-jay.js?v=' site/preview/v116-marina/index.html
          test -s site/preview/v116-marina/assets/jay-v117/jay-walk.webp
          test -s site/preview/v116-marina/assets/jay-v117/jay-run.webp
          node --check site/preview/v116-marina/v116-marina-walk.js
          grep -q 'v116-marina-walk.js?v=' site/preview/v116-marina/index.html
          test -s site/preview/v116-marina/assets/v116-marina/walk-officer.webp
          node --check site/preview/v116-marina/v116-marina-hud.js
          grep -q 'v116-marina-hud.js' site/preview/v116-marina/index.html
          test -s site/preview/v116-marina/assets/v116-marina/marina-reference-atlas.webp
          (cd v116-marina && node qa/check-v115-campus.cjs)
          (cd v116-marina && node qa/check-v115-connected-city.cjs)
          (cd v116-marina && node qa/check-v115-road-layout.cjs)
          cmp -s game-backup/published-game-capture/index.html site/index.html
          cmp -s game-backup/published-game-capture/game.js site/game.js
          cmp -s game-backup/published-game-capture/outbreak.css site/outbreak.css
          cmp -s precinct-pilot/published-game-capture/game.js site/preview/v116-marina/game.js
          cmp -s game-backup/published-game-capture/outbreak.css site/preview/v116-marina/outbreak.css
          echo 'V116 native source alignment: Waterfront y=3800 seawall and original piers x=4655,5105,5555 verified by QA'
          echo 'PASS V116 build: connected gameplay module; normal game and Zombie Outbreak unchanged'

      - name: Capture V116 real-game portrait and landscape QA, same camera before/after
        shell: bash
        run: |
          set -euo pipefail
          V116_URL='http://127.0.0.1:8765/preview/v116-marina/?v116QA=1&pilotQA=1' \
