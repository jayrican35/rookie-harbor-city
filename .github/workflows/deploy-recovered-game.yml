          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops
          import json
          folder=Path('site/preview/v120-premium/evidence')
          d={}
          for key in ('portrait','landscape'):
            a=Image.open(folder/f'{key}-before-canvas.png').convert('RGB')
