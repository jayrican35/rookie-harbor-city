name: Play recovered ROOKIE on GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-recovered-game.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-recovered-rookie
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out isolated published-game backup
        uses: actions/checkout@v4
        with:
          ref: published-v1-backup
          path: game-backup
          persist-credentials: false

      - name: Prepare game website without modifying source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp -a game-backup/published-game-capture/. site/
          test -s site/index.html
          test -s site/game.js
          touch site/.nojekyll
          echo "Recovered game JavaScript size: $(wc -c < site/game.js)"
          echo "Recovered art/audio file count: $(find site/assets -type f | wc -l)"
          echo "Note: This publishes a TEST copy of the recovered game, not the original editor project."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload recovered website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy recovered website
        id: deployment
        uses: actions/deploy-pages@v4
