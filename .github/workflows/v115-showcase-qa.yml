name: V115 Showcase — Precinct to Midtown Visual QA
on:
  push:
    branches: [feature/v115-showcase-precinct-midtown]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  showcase-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate all V115 visual-only scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check published-game-capture/game.js
          node --check published-game-capture/v115-world.js
          node --check published-game-capture/v115-campus.js
          node --check published-game-capture/v115-showcase.js
          node qa/check-v115-world.cjs published-game-capture/v115-world.js
          node qa/check-v115-campus.cjs
          node qa/check-v115-connected-city.cjs
          node qa/check-v115-road-layout.cjs
          node qa/check-v115-showcase.cjs
          python3 -m py_compile tools/build_v115_showcase_preview.py
      - name: Protect original game and Zombie Outbreak byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/v115-one-living-world
          for f in published-game-capture/game.js published-game-capture/outbreak.css; do
            test "$(git rev-parse origin/feature/v115-one-living-world:$f)" = "$(git rev-parse HEAD:$f)" || { echo "PROTECTED FILE CHANGED: $f"; exit 1; }
          done
          python3 - <<'PY'
          import subprocess
          base='origin/feature/v115-one-living-world'
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={
            'published-game-capture/v115-campus.js',
            'published-game-capture/v115-showcase.js',
            'published-game-capture/v115-showcase.css',
            'tools/build_v115_showcase_preview.py',
            'qa/check-v115-showcase.cjs',
            '.github/workflows/v115-showcase-qa.yml',
            'docs/v115-showcase-precinct-midtown.md'
          }
          assert changed <= allowed, 'Unexpected file changes: '+str(sorted(changed-allowed))
          assert 'published-game-capture/v115-showcase.js' in changed
          print('PASS: showcase is additive, protected engine and Zombie Outbreak unchanged')
          PY
