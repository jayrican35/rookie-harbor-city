name: V122 fetch published gameplay screenshots for visual inspection
on:
  push:
    branches: [feature/v122-pier-depth-structural-fix]
    paths: ['.github/workflows/v122-live-audit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Retrieve and resize LIVE deployed V122 pier before/after screenshots
        run: |
          python3 -m pip install -q pillow requests
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import requests,io
          folder=Path('qa/v122-reference');folder.mkdir(parents=True,exist_ok=True)
          for scene in ('behind-post','in-front-of-post'):
           for version in ('before','after'):
            url=f'https://jayrican35.github.io/rookie-harbor-city/preview/v122-pier/evidence/{scene}-{version}-gameplay.png'
            res=requests.get(url,timeout=45);res.raise_for_status()
            im=Image.open(io.BytesIO(res.content)).convert('RGB');im.thumbnail((610,1000))
            im.save(folder/f'{scene}-{version}.jpg',quality=84,optimize=True)
            print('Real game screenshot',scene,version,im.size)
          PY
      - name: Commit only screenshot evidence, never game assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/v122-reference/*.jpg
          if ! git diff --cached --quiet; then
           git commit -m 'Archive V122 actual running-game occlusion QA screenshots'
           git push origin HEAD:feature/v122-pier-depth-structural-fix
          fi
