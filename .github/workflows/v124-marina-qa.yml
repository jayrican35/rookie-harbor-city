name: V124 structural depth and doorway regression
on:
  push:
    branches: [feature/v124-marina-depth-doorway-correction]
    paths:
      - 'published-game-capture/v116-marina.js'
      - 'published-game-capture/v115-campus.js'
      - 'qa/check-v124-depth.cjs'
      - 'qa/capture-v124-depth.cjs'
      - 'tools/build_v124_preview.py'
      - '.github/workflows/v124-marina-qa.yml'
      - 'docs/V124-DEPTH-FIX.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify source syntax and new world-space actor sorting
        run: |
          node --check published-game-capture/v116-marina.js
          node --check published-game-capture/v115-campus.js
          node qa/check-v124-depth.cjs
          node qa/check-v123-collision.cjs
          node qa/check-v122-pier.cjs
          node qa/check-v121-marina.cjs
      - name: Legacy game, NPC, navigation, entrance and HUD compatibility
        run: |
          node qa/check-v115-campus.cjs
          node qa/check-v115-connected-city.cjs
          node qa/check-v115-road-layout.cjs
          node qa/check-v116-marina.cjs
          node qa/check-v116-walk.cjs
          node qa/check-v116-hud.cjs
          node qa/check-v117-jay.cjs
          node qa/check-v117-interiors.cjs
      - name: Build full original connected city with V124 depth and door refinements
        run: |
          python3 -m pip install -q pillow numpy
          cp -a published-game-capture /tmp/v124-preview
          python3 tools/build_v124_preview.py /tmp/v124-preview
          grep -q 'v124-object-foot-sort-and-doorway' /tmp/v124-preview/index.html
          node --check /tmp/v124-preview/game-v115.bundle.js
          test -s /tmp/v124-preview/assets/v123-marina-npcs/walk-visitor.png
      - name: Enforce approved game and Zombie Outbreak absolute isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='fa7e49975e4799d68d2953f9a13e06d967ffd87d'
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={'published-game-capture/v116-marina.js','published-game-capture/v115-campus.js',
            'qa/check-v124-depth.cjs','qa/capture-v124-depth.cjs','tools/build_v124_preview.py',
            '.github/workflows/v124-marina-qa.yml','docs/V124-DEPTH-FIX.md'}
          assert changed<=allowed,sorted(changed-allowed)
          for path in ('published-game-capture/game.js','published-game-capture/outbreak.css',
                       'published-game-capture/v116-marina-walk.js','published-game-capture/v117-jay.js'):
            assert subprocess.check_output(['git','show',base+':'+path])==Path(path).read_bytes(),path
          assert not any('/assets/' in x or 'zombie' in x.lower() or 'outbreak' in x.lower() for x in changed)
          print('PASS V124: only shared existing noncombat scenery/depth queue changed; approved game, textures and Zombie Outbreak untouched')
          PY
