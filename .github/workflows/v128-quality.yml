name: Harbor City World Completion (isolated)
on:
  push:
    branches:
      - feature/v128-citywide-quality-run-scale
  pull_request:
    paths:
      - 'published-game-capture/v117-jay.js'
      - 'published-game-capture/v127-citywide-art.js'
      - 'published-game-capture/v115-campus.js'
      - 'qa/check-v128-quality.cjs'
      - 'qa/check-world-completion.cjs'
      - 'qa/check-world-pedestrians.cjs'
      - 'qa/check-world-roads.cjs'
      - 'qa/check-world-traffic.cjs'
      - 'qa/check-bayview-frontage.cjs'
      - 'qa/capture-bayview-frontage.cjs'
      - 'tools/build_bayview_preview.py'
      - 'published-game-capture/v115-world.js'
      - 'qa/capture-v128-run.cjs'
      - 'tools/build_v128_preview.py'
jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run whole-world graphics, grounded Jay, protected-mode tests
        run: |
          set -euo pipefail
          node --check published-game-capture/v117-jay.js
          node --check published-game-capture/v127-citywide-art.js
          node --check published-game-capture/v115-campus.js
          node --check published-game-capture/v115-world.js
          node qa/check-v128-quality.cjs
          node qa/check-world-completion.cjs
          node qa/check-world-pedestrians.cjs
          node qa/check-world-roads.cjs
          node qa/check-world-traffic.cjs
          node qa/check-bayview-frontage.cjs
          node qa/check-v127-citywide.cjs
          node qa/check-v126-polish.cjs
          node qa/check-v117-jay.cjs
      - name: Ensure modifications stay isolated to connected-world art
        run: |
          set -euo pipefail
          git diff --name-only ${{ github.event.before || 'HEAD^' }} HEAD | grep -Ev '^(published-game-capture/(v117-jay\.js|v115-campus\.js|v115-world\.js|v127-citywide-art\.js)|qa/check-v128-quality\.cjs|qa/check-world-completion\.cjs|qa/check-world-pedestrians\.cjs|qa/check-world-roads\.cjs|qa/check-world-traffic\.cjs|qa/check-bayview-frontage\.cjs|qa/capture-v128-run\.cjs|qa/capture-bayview-frontage\.cjs|tools/build_v128_preview\.py|tools/build_bayview_preview\.py|docs/(V128-WORLD-QUALITY|HARBOR-CITY-WORLD-COMPLETION)\.md|\.github/workflows/v128-quality\.yml)$' > /tmp/out-of-scope || true
          if [ -s /tmp/out-of-scope ]; then cat /tmp/out-of-scope; exit 1; fi

  browser-road-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact build and browser dependencies
        run: |
          python3 -m pip install -q pillow numpy
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build single isolated World Completion game
        run: |
          set -euo pipefail
          mkdir -p site/preview/v128-world-quality
          cp -a published-game-capture/. site/preview/v128-world-quality/
          python3 tools/build_v128_preview.py site/preview/v128-world-quality
          node --check site/preview/v128-world-quality/game-v115.bundle.js
      - name: Run real Chromium phone-viewport road, Jay and traffic tests
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory site >/tmp/world-road-http.log 2>&1 &
          sleep 2
          node qa/capture-v128-run.cjs
      - name: Save real gameplay evidence and diagnostic trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-world-browser-road-evidence
          path: site/preview/v128-world-quality/evidence/
          if-no-files-found: warn
  bayview-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch last verified published V128 for exact-camera comparison
        uses: actions/checkout@v4
        with:
          ref: 7339eaba5a3756b4fc9dbcbc72ba54c5e7822a8c
          path: reference-v128
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual game builder and Chromium
        run: |
          python3 -m pip install -q pillow numpy
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build separate original and improved playable previews
        run: |
          set -euo pipefail
          mkdir -p site/preview/v128-world-quality site/preview/v129-bayview
          cp -a reference-v128/published-game-capture/. site/preview/v128-world-quality/
          cp -a published-game-capture/. site/preview/v129-bayview/
          python3 reference-v128/tools/build_v128_preview.py site/preview/v128-world-quality
          python3 tools/build_bayview_preview.py site/preview/v129-bayview
          node --check site/preview/v129-bayview/game-v115.bundle.js
          cmp -s site/preview/v128-world-quality/game.js site/preview/v129-bayview/game.js
          cmp -s site/preview/v128-world-quality/outbreak.css site/preview/v129-bayview/outbreak.css
      - name: Capture 6 exact-camera Android-size real-game before/after pairs
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory site >/tmp/bayview-http.log 2>&1 &
          sleep 2
          node qa/capture-bayview-frontage.cjs
          python3 - <<'PY'
          from PIL import Image,ImageChops
          from pathlib import Path
          import json
          p=Path('site/preview/v129-bayview/evidence')
          scenes=['recorded-bayview-road-mouth','southbay-road-approach','bayview-south-terrace',
             'bayview-west-promenade','bayview-marina-seam','original-marina-protected']
          metrics={}
          for scene in scenes:
            with Image.open(p/(scene+'-before.png')) as a,Image.open(p/(scene+'-after.png')) as b:
              aa=a.convert('RGB');bb=b.convert('RGB')
              assert aa.size==bb.size,(scene,aa.size,bb.size)
              histogram=ImageChops.difference(aa,bb).convert('L').histogram()
              metrics[scene]=round(sum(histogram[15:])/max(1,sum(histogram)),4)
          (p/'pixel-differences.json').write_text(json.dumps(metrics,indent=2))
          for name in scenes[:5]:
            assert metrics[name]>.002,(name,'No visible environmental improvement')
          print('PASS REAL before/after pixel differences',metrics)
          PY
      - name: Publish development evidence artifact only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bayview-waterfront-mobile-before-after
          path: site/preview/v129-bayview/evidence/
          if-no-files-found: warn
