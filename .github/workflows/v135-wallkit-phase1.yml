name: Precinct 9 Phase 1 Modular Wall Kit QA
on:
  push:
    branches:
      - feature/v135-precinct9-phase1-wallkit
    paths:
      - tools/build_precinct9_wallkit_phase1.py
      - tools/build_v135_precinct_wallkit_preview.py
      - published-game-capture/v134-precinct-reference.js
      - published-game-capture/v135-precinct-wallkit-test.js
      - qa/capture-v135-wallkit.cjs
      - docs/PRECINCT9-PHASE1-WALLKIT.md
      - .github/workflows/v135-wallkit-phase1.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wall-kit-assets-and-real-game:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing game QA dependencies
        run: |
          set -euo pipefail
          python3 -m pip install -q pillow numpy
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build Phase 1 modular PNG wall atlas
        run: |
          set -euo pipefail
          python3 tools/build_precinct9_wallkit_phase1.py published-game-capture/assets/precinct9-wall-kit-phase1
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops
          import json
          d=Path('published-game-capture/assets/precinct9-wall-kit-phase1')
          m=json.loads((d/'manifest.json').read_text())
          assert m['tileSize']==32 and m['worldPixelsPerAssetPixel']==1
          assert len(m['frames'])==26
          atlas=Image.open(d/m['atlas']).convert('RGBA')
          assert atlas.size==(1024,1024)
          for n,f in m['frames'].items():
            im=Image.open(d/f['file']).convert('RGBA')
            assert im.width%32==0 and im.height%32==0
            a=f['atlas']
            assert im.size==(a['w'],a['h'])
            assert ImageChops.difference(im,atlas.crop((a['x'],a['y'],a['x']+a['w'],a['y']+a['h']))).getbbox() is None,n
          assert Image.open(d/'wall_window_cut_single.png').getpixel((60,60))[3]==0
          print('PASS 26 RGBA PNGs and atlas validated')
          PY
      - name: Audit existing gameplay and protected mode files
        run: |
          set -euo pipefail
          node --check published-game-capture/v134-precinct-reference.js
          node --check published-game-capture/v135-precinct-wallkit-test.js
          node --check qa/capture-v135-wallkit.cjs
          node qa/check-v134-precinct.cjs
          node qa/check-world-roads.cjs
          node qa/check-world-traffic.cjs
          git fetch --no-tags --depth=1 origin 9a8843692cf27a19cc805b3f15c2fc417378072c
          while IFS= read -r f; do
            case "$f" in
              published-game-capture/v134-precinct-reference.js|published-game-capture/v135-precinct-wallkit-test.js|published-game-capture/assets/precinct9-wall-kit-phase1/*|tools/build_precinct9_wallkit_phase1.py|tools/build_v135_precinct_wallkit_preview.py|qa/capture-v135-wallkit.cjs|docs/PRECINCT9-PHASE1-WALLKIT.md|.github/workflows/v135-wallkit-phase1.yml) ;;
              *) echo "Unexpected change outside Phase 1: $f"; exit 1 ;;
            esac
          done < <(git diff --name-only 9a8843692cf27a19cc805b3f15c2fc417378072c HEAD)
          echo 'PASS no Zombie Outbreak or unrelated original game files changed'
      - name: Build original V134 and separate V135 in real connected world
        run: |
          set -euo pipefail
          mkdir -p site/preview/precinct9-v134-lab site/preview/precinct9-v135-wallkit-lab
          cp -a published-game-capture/. site/preview/precinct9-v134-lab/
          cp -a published-game-capture/. site/preview/precinct9-v135-wallkit-lab/
          python3 tools/build_v134_precinct_preview.py site/preview/precinct9-v134-lab
          python3 tools/build_v135_precinct_wallkit_preview.py site/preview/precinct9-v135-wallkit-lab
          node --check site/preview/precinct9-v135-wallkit-lab/game-v115.bundle.js
          for f in game.js outbreak.css v116-marina.js v127-citywide-art.js v115-world.js v117-jay.js; do
            cmp -s site/preview/precinct9-v134-lab/$f site/preview/precinct9-v135-wallkit-lab/$f
          done
      - name: Capture and validate actual Android game screenshots
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory site >/tmp/v135-http.log 2>&1 &
          sleep 2
          node qa/capture-v135-wallkit.cjs
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops
          import json,html
          p=Path('site/preview/precinct9-v135-wallkit-lab/evidence')
          data=json.loads((p/'qa-metrics.json').read_text())
          cards=[]
          for s in data['views']:
            n=s['name'];bef=p/(n+'-before.png');aft=p/(n+'-after.png')
            assert bef.is_file() and aft.is_file(),n
            if n=='phase1-wall-kit-southwest-wall':
              with Image.open(bef) as a, Image.open(aft) as b:
                assert ImageChops.difference(a.convert('RGB'),b.convert('RGB')).getbbox()
            cards.append('<section><h2>'+html.escape(n.replace('-',' ').title())+'</h2><div class="compare"><img src="'+n+'-before.png"><img src="'+n+'-after.png"></div></section>')
          (p/'index.html').write_text('<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Precinct 9 Wall Kit Phase 1</title><style>body{background:#12283f;color:#f1dfb9;font:16px system-ui}.compare{display:grid;grid-template-columns:1fr 1fr;gap:6px}.compare img{width:100%;min-width:0}h2{font-size:18px}</style><h1>V135 Phase 1 — actual mobile game test</h1><p>Left old V134; right native V135 wall-kit modules. No completed window, door or signs; protected modes unchanged.</p>'+''.join(cards)+'</html>')
          PY
      - name: Upload source-derived wall PNGs and actual game proof
        uses: actions/upload-artifact@v4
        with:
          name: precinct9-wallkit-phase1-png-and-test
          path: |
            published-game-capture/assets/precinct9-wall-kit-phase1/
            site/preview/precinct9-v135-wallkit-lab/evidence/
          if-no-files-found: error
      - name: Commit verified PNG files into isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add published-game-capture/assets/precinct9-wall-kit-phase1/
          if git diff --cached --quiet; then
            echo 'Phase-1 PNGs already committed'
          else
            git commit -m 'Phase 1 wall kit actual transparent PNG modules and atlas'
            git push origin HEAD:feature/v135-precinct9-phase1-wallkit
          fi
