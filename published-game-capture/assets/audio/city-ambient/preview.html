<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbor City Audio Preview</title><style>body{font:16px system-ui;background:#0f2031;color:#f5f8fc;max-width:850px;margin:auto;padding:24px}h1{font-size:25px}.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334e60;padding:8px;gap:18px}button{background:#ffd26a;color:#1c2833;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}small{color:#abc}p{line-height:1.55}.cat{margin-top:30px;color:#ffcc70}audio{width:100%;margin-top:10px}</style></head><body><h1>ROOKIE: Harbor City — Audio Preview</h1><p>Original synthetic SFX starter pack; click a clip to preview. Ambient loops are meant to be mixed very quietly underneath gameplay. Full details and Codex integration notes are in README_FIRST.md.</p><div id="app"></div><script>
const clips=[{"id": "footstep_pavement_01", "category": "footsteps", "duration": 0.32}, {"id": "footstep_pavement_02", "category": "footsteps", "duration": 0.32}, {"id": "footstep_pavement_03", "category": "footsteps", "duration": 0.32}, {"id": "footstep_grass_01", "category": "footsteps", "duration": 0.32}, {"id": "footstep_grass_02", "category": "footsteps", "duration": 0.32}, {"id": "footstep_grass_03", "category": "footsteps", "duration": 0.32}, {"id": "footstep_wood_01", "category": "footsteps", "duration": 0.32}, {"id": "footstep_wood_02", "category": "footsteps", "duration": 0.32}, {"id": "footstep_run_pavement", "category": "footsteps", "duration": 0.24}, {"id": "bird_chirp_01", "category": "birds", "duration": 0.32}, {"id": "bird_chirp_02", "category": "birds", "duration": 0.5}, {"id": "bird_chirp_03", "category": "birds", "duration": 0.34}, {"id": "bird_chirp_04", "category": "birds", "duration": 0.58}, {"id": "ambience_forest_birds", "category": "ambience", "duration": 14.0}, {"id": "car_passby_01", "category": "vehicles", "duration": 3.3}, {"id": "car_passby_02", "category": "vehicles", "duration": 3.7}, {"id": "car_engine_idle_loop", "category": "vehicles", "duration": 3.0}, {"id": "car_engine_rev", "category": "vehicles", "duration": 3.8}, {"id": "car_horn_short", "category": "vehicles", "duration": 0.73}, {"id": "ambience_city_traffic", "category": "ambience", "duration": 14.0}, {"id": "car_door_close", "category": "vehicles", "duration": 0.46}, {"id": "bird_gull_call", "category": "birds", "duration": 1.5}];
const app=document.querySelector('#app');let audio=null,button=null;
for(const cat of ['footsteps','birds','vehicles','ambience']){let h=document.createElement('h2');h.className='cat';h.textContent=cat[0].toUpperCase()+cat.slice(1);app.append(h);
for(const c of clips.filter(x=>x.category===cat)){let row=document.createElement('div');row.className='item';let info=document.createElement('div');info.textContent=c.id.replace(/_/g,' ');let hint=document.createElement('small');hint.textContent=` • ${c.duration}s`;info.append(hint);let b=document.createElement('button');b.textContent='Play';b.onclick=()=>{if(audio){audio.pause();audio.currentTime=0;if(button)button.textContent='Play';if(button===b){audio=null;button=null;return;}}audio=new Audio('audio/'+c.id+'.mp3');audio.loop=c.category==='ambience'||c.id==='car_engine_idle_loop';audio.volume=c.category==='ambience'?.5:.85;button=b;b.textContent='Stop';audio.play().catch(()=>{b.textContent='Playback failed';});audio.onended=()=>{b.textContent='Play';button=null;audio=null;};};row.append(info,b);app.append(row);}}
</script></body></html>
