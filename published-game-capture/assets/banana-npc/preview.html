<!doctype html><html lang="en"><meta charset="utf-8"><title>Banana NPC walk preview</title><style>body{font:16px system-ui;color:#f8f4ff;background:#171524;margin:32px}.frame{display:inline-block;background-color:#b7bec8;background-image:conic-gradient(#e8e9eb 25%,transparent 0 50%,#e8e9eb 0 75%,transparent 0);background-size:24px 24px;padding:8px;border:2px solid #7258a0;border-radius:12px}canvas{image-rendering:pixelated;width:224px;height:240px}select{font:inherit;margin:10px;padding:6px}p{color:#c4b9dc}</style><h1>Banana — animation preview</h1><p>Matches the Chicken NPC atlas layout. Pilot extracted art; inspect the outlines.</p><label>Animation <select id="anim"><option value="walk">Walk</option><option value="idle">Idle</option><option value="talk">Talk</option><option value="argue">Argue</option></select></label><label>Direction <select id="dir"><option value="0">Down</option><option value="1">Left</option><option value="2">Right</option><option value="3">Up</option></select></label><div><div class="frame"><canvas width="112" height="120" id="cv"></canvas></div></div><p>Try each direction and animation. For full source see README_FIRST.md.</p><script>
const sheets={walk:{src:'sprites/atlas/banana_walk_4x4.png',w:112,h:120,ms:170},idle:{src:'sprites/atlas/banana_idle_4x1.png',w:112,h:120,ms:380},talk:{src:'sprites/atlas/banana_talk_4x1.png',w:112,h:120,ms:220},argue:{src:'sprites/atlas/banana_argue_4x1.png',w:160,h:160,ms:230}};
const imgs={};for(const [k,v] of Object.entries(sheets)){imgs[k]=new Image; imgs[k].src=v.src;}
const c=document.getElementById('cv'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const anim=document.getElementById('anim'),dir=document.getElementById('dir');
function draw(ts){const key=anim.value,s=sheets[key]; const f=Math.floor(ts/s.ms)%4;const row=key==='walk'?+dir.value:0;ctx.clearRect(0,0,c.width,c.height);if(key==='argue'){c.width=160;c.height=160;}else{c.width=112;c.height=120;}ctx.imageSmoothingEnabled=false;if(imgs[key].complete&&imgs[key].naturalWidth){ctx.drawImage(imgs[key],f*s.w,row*s.h,s.w,s.h,0,0,c.width,c.height)}requestAnimationFrame(draw)}requestAnimationFrame(draw)
</script></html>
