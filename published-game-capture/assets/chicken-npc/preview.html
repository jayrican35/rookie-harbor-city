<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chicken NPC — local animation preview</title><style>body{background:#0d1729;color:#fff;font:16px system-ui;text-align:center;padding:18px}button,select{font:inherit;margin:5px;padding:8px 12px;border-radius:8px;background:#ffda65;border:0}canvas{max-width:90vw;image-rendering:pixelated;background:#384253;border:4px solid #6e8ab4;border-radius:12px}</style></head><body><h2>CHICKEN — Harbor City NPC</h2><p>Local review only. No project files are modified.</p><select id="direction"><option value="0">Down</option><option value="1">Left</option><option value="2">Right</option><option value="3">Up</option></select><button id="toggle">Pause</button><p><canvas id="stage" width="448" height="480"></canvas></p><small>Transparent 112×120 sprites • 4 directions × 4 walk frames</small><script>const img=new Image();img.src='sprites/atlas/chicken_walk_4x4.png';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;let frame=0,paused=false,last=0;document.getElementById('toggle').onclick=()=>{paused=!paused;document.getElementById('toggle').textContent=paused?'Play':'Pause'};function loop(t){if(!paused&&t-last>=170){frame=(frame+1)%4;last=t}ctx.fillStyle='#566271';ctx.fillRect(0,0,448,480);for(let y=0;y<480;y+=24)for(let x=0;x<448;x+=24){if((x/24+y/24)%2===0){ctx.fillStyle='#687585';ctx.fillRect(x,y,24,24)}}if(img.complete&&img.naturalWidth){let dir=+document.getElementById('direction').value;ctx.drawImage(img,frame*112,dir*120,112,120,0,0,448,480)}requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
