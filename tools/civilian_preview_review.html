<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Harbor City — civilian artwork</title>
<style>body{margin:0;background:#102238;color:#eee;font:15px system-ui}header{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:10px}h1{font-size:18px;margin:0}button,select,a{font:inherit;color:inherit}button,select{background:#24445b;padding:7px;border:1px solid #c2a46b}button[aria-pressed=true]{background:#dfc080;color:#102238}iframe{width:100%;height:calc(100dvh - 100px);min-height:500px;border:0;display:block}</style>
<header><h1>Connected city · civilian art</h1><button data-version="updated" aria-pressed="true">New civilians</button><button data-version="before" aria-pressed="false">Previous artwork</button><select id="scene"><option value="4130,3980,.95">Bayview & marina gateway</option><option value="5150,3720,1.2">Marina civilians</option><option value="3985,3920,1.4">Bait shop staff</option><option value="680,1150,.7">Precinct — protected cast</option><option value="5600,1750,.7">Downtown</option></select><a href="/evidence/civilian-preview/">30 outfits & gameplay checks</a><a href="/evidence/waterfront-layout/">Waterfront layout</a></header>
<iframe title="Playable connected city civilian artwork"></iframe><script>
const frame=document.querySelector('iframe');let generation=0;
function camera(){const a=frame.contentWindow.HARBOR?.seamlessCampusV115;if(!a)return;a.qaCamera(...document.querySelector('#scene').value.split(',').map(Number));frame.contentWindow.focus()}
function load(tag){const id=++generation;document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.version===tag)));frame.onload=()=>{function ready(n){if(id!==generation)return;const a=frame.contentWindow.HARBOR?.seamlessCampusV115;if(a&&a.openAt(3750,4136,.8)){camera();return}if(n)setTimeout(()=>ready(n-1),100)}ready(150)};frame.src='/preview/civilian-'+tag+'/?pilotQA=1'}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>load(b.dataset.version));document.querySelector('#scene').onchange=camera;load('updated');
</script>
